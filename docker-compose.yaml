services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moderation
      POSTGRES_USER: moduser
      POSTGRES_PASSWORD: modpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moduser -d moderation"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
    command: bun run dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://moduser:modpass@postgres:5432/moderation
      REDIS_URL: redis://redis:6379
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  seeder:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
    command: bun seed-events.ts --events=${SEED_EVENTS:-5}
    environment:
      API_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  client:
    image: node:24-alpine
    working_dir: /client
    volumes:
      - ./client:/client
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: ws://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: